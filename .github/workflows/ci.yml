name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database only)
        env:
          SUPABASE_AUTH_EXTERNAL_KAKAO_CLIENT_ID: ci-placeholder
          SUPABASE_AUTH_EXTERNAL_KAKAO_SECRET: ci-placeholder
        run: npx supabase db start --workdir src
      - name: pgTAP
        run: npx supabase test db --workdir src
