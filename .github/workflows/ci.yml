name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (catches Cache Components violations)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_AUTH_EXTERNAL_KAKAO_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_KAKAO_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npm run db:start
      - name: pgTAP
        run: npm run db:test
      - name: Integration tests
        run: |
          node src/scripts/local-env.mjs
          npm run test:int
      # Screens on a phone-sized browser against the same local stack (the dev
      # server is started by Playwright). Values below are local-only test values.
      - name: E2E (Playwright)
        env:
          CRON_SECRET: local-cron-secret
          NEXT_PUBLIC_CHURCH_TIME_ZONE: America/Los_Angeles
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          MAIL_FROM: "Church Intranet <no-reply@example.org>"
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Keep the E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            build/playwright-report
            build/playwright
          retention-days: 7
